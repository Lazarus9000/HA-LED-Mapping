<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LED 2D Mapping</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111827; color: #f3f4f6; margin: 0; padding: 20px; }
    .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
    .card { background: #1f2937; padding: 16px; border-radius: 10px; }
    h2 { margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid #374151; padding-bottom: 8px; }
    select, input, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px; border: 1px solid #374151; background: #111827; color: #fff; box-sizing: border-box; }
    button.start { background: #10b981; border: none; font-weight: 600; cursor: pointer; }
    button.stop { background: #ef4444; border: none; font-weight: 600; cursor: pointer; }
    button.upload { background: #3b82f6; border: none; font-weight: 600; cursor: pointer; }
    canvas { width: 100%; height: auto; background: #000; border-radius: 8px; border: 1px solid #374151; }
    .status { font-size: 0.9rem; color: #9ca3af; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="card" style="margin-bottom: 20px;">
        <h2>Effect Controller</h2>
        <select id="effectSelect">
          {% for effect in effects %}
          <option value="{{ effect }}" {% if effect == active_effect %}selected{% endif %}>{{ effect }}</option>
          {% endfor %}
        </select>
        <button class="start" onclick="startEffect()">Start Effect</button>
        <button class="stop" onclick="stopEffect()">Stop Effect</button>
        <div class="status" id="effectStatus">
          Running: <strong>{{ active_effect or "None" }}</strong>
        </div>
      </div>

      <div class="card">
        <h2>Upload Calibration</h2>
        <form id="uploadForm" onsubmit="uploadCalibration(event)">
          <label>Calibration JSON:</label>
          <input type="file" name="calibration_file" accept=".json" required />
          <label>Reference Image (Optional):</label>
          <input type="file" name="reference_image" accept="image/*" />
          <button class="upload" type="submit">Upload & Refresh</button>
        </form>
      </div>
    </div>

    <div class="card">
      <h2>2D Calibration Viewer <span id="ledHoverInfo" style="float:right; color:#10b981;"></span></h2>
      <canvas id="calibCanvas" width="1280" height="720"></canvas>
    </div>
  </div>

  <script>
    let points = [];
    let bgImage = null;

    async function startEffect() {
      const effect = document.getElementById("effectSelect").value;
      if (!effect) return;
      const formData = new FormData();
      formData.append("effect", effect);
      const res = await fetch("api/effect/start", { method: "POST", body: formData });
      if (res.ok) document.getElementById("effectStatus").innerHTML = `Running: <strong>${effect}</strong>`;
    }

    async function stopEffect() {
      const res = await fetch("api/effect/stop", { method: "POST" });
      if (res.ok) document.getElementById("effectStatus").innerHTML = `Running: <strong>None</strong>`;
    }

    async function uploadCalibration(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const res = await fetch("upload-calibration", { method: "POST", body: formData });
      if (res.ok) await loadViewer();
    }

    async function loadViewer() {
      const canvas = document.getElementById("calibCanvas");

      const imgRes = await fetch("api/reference-image");
      if (imgRes.ok) {
        const blob = await imgRes.blob();
        bgImage = await createImageBitmap(blob);
        canvas.width = bgImage.width;
        canvas.height = bgImage.height;
      }

      const calRes = await fetch("api/calibration");
      if (!calRes.ok) return;
      const raw = await calRes.json();
      const list = Array.isArray(raw) ? raw : (raw.leds || raw.points || []);

      points = list.map((p, idx) => Array.isArray(p)
        ? { id: idx, x: p[0], y: p[1] }
        : { id: p.id ?? idx, x: p.x, y: p.y }
      );

      drawCanvas();
    }

    function drawCanvas(highlightId = null) {
      const canvas = document.getElementById("calibCanvas");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (bgImage) {
        ctx.globalAlpha = 0.55;
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1.0;
      }

      const isNormalized = points.length > 0 && points.every(p => p.x <= 1.0 && p.y <= 1.0);

      points.forEach(p => {
        const cx = isNormalized ? p.x * canvas.width : p.x;
        const cy = isNormalized ? p.y * canvas.height : p.y;
        p._cx = cx;
        p._cy = cy;

        ctx.beginPath();
        ctx.arc(cx, cy, p.id === highlightId ? 7 : 4, 0, Math.PI * 2);
        ctx.fillStyle = p.id === highlightId ? "#f59e0b" : "#10b981";
        ctx.fill();
      });
    }

    document.getElementById("calibCanvas").addEventListener("mousemove", (e) => {
      const canvas = e.target;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;

      let closest = null;
      let minDist = 18;
      for (const p of points) {
        const d = Math.hypot(p._cx - mx, p._cy - my);
        if (d < minDist) { minDist = d; closest = p; }
      }

      document.getElementById("ledHoverInfo").textContent = closest
        ? `LED #${closest.id} (${closest.x.toFixed(2)}, ${closest.y.toFixed(2)})`
        : "";
      drawCanvas(closest ? closest.id : null);
    });

    loadViewer();
  </script>
</body>
</html>
