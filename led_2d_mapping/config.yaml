name: "LED 2D Mapping"
description: "2D LED matrix calibration viewer and effect controller"
version: "1.2.1"
slug: "led_2d_mapping"
init: false
arch:
  - aarch64
  - amd64
  - armv7
ingress: true
ingress_port: 8099
panel_icon: "mdi:led-strip-variant"
panel_title: "LED 2D Mapping"
map:
  - share:rw
# Uses the MQTT broker (Mosquitto add-on) when there is one, to show up in Home Assistant
# as a light entity. Works without it too
services:
  - mqtt:want
options:
  default_udp_ip: "192.168.1.100"
  default_udp_port: 21324
schema:
  default_udp_ip: str
  default_udp_port: int
